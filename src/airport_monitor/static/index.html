<!DOCTYPE html>
<html lang="zh-CN" data-default-lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title data-i18n="title">机场监视</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect fill='%230B1F33' width='16' height='16'/%3E%3Crect fill='%233B82C4' y='13' width='16' height='3'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light;
      --navy: #0B1F33;
      --ink: #1A2332;
      --muted: #5C6B7A;
      --line: #D5DEE7;
      --paper: #F4F7FA;
      --sky: #3B82C4;
      --sky-2: #5BA3D9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      line-height: 1.4;
    }
    .top { background: var(--navy); color: #E7EEF5; }
    .top-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 14px 20px 12px;
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: flex-end;
    }
    .brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    .icao {
      margin: 0;
      font-family: ui-monospace, "Cascadia Mono", "Segoe UI Mono", Menlo, Consolas, monospace;
      font-size: 22px;
      letter-spacing: 0.08em;
      font-weight: 600;
    }
    .title { font-size: 15px; font-weight: 500; color: #C5D4E4; }
    .place { margin: 3px 0 0; color: #8FA4B8; font-size: 12px; }
    .poll {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      text-align: right;
    }
    .lang {
      display: inline-flex;
      margin-bottom: 6px;
      border: 1px solid #34506A;
    }
    .lang button {
      margin: 0;
      padding: 1px 8px 2px;
      border: 0;
      background: transparent;
      color: #9FB4C8;
      font: inherit;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      line-height: 1.45;
      cursor: pointer;
    }
    .lang button + button { border-left: 1px solid #34506A; }
    .lang button.is-active { background: var(--sky); color: #fff; }
    .lang button:focus-visible { outline: 2px solid var(--sky-2); outline-offset: 1px; }
    .live {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #9FB4C8;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 600;
    }
    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--sky-2);
    }
    .live-dot.is-live { animation: pulse 2.4s ease-out infinite; }
    .live-dot.is-stale { background: #C4895A; animation: none; }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(91, 163, 217, 0.55); }
      100% { box-shadow: 0 0 0 8px rgba(91, 163, 217, 0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .live-dot.is-live { animation: none; }
    }
    .poll-line {
      margin-top: 4px;
      font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
      font-size: 12px;
      color: #D5E2EE;
    }
    .accent { height: 3px; background: var(--sky); }
    .banner-wrap { max-width: 1120px; margin: 12px auto 0; padding: 0 20px; }
    .banner {
      margin: 0;
      padding: 8px 12px;
      background: #F8EFE6;
      color: #6B3A1F;
      border: 1px solid #E4D0C0;
      font-size: 13px;
    }
    .stats { background: #fff; border-bottom: 1px solid var(--line); }
    .stats-inner {
      max-width: 1120px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
    }
    .stat { padding: 10px 16px 9px; border-right: 1px solid #E3EAF1; }
    .stat:last-child { border-right: 0; }
    .stat-value {
      font-variant-numeric: tabular-nums;
      font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
      font-size: 20px;
      color: var(--navy);
    }
    .stat-air .stat-value { color: var(--sky); }
    .stat-label {
      margin-top: 1px;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
    }
    .stat-note {
      min-height: 1.1em;
      font-size: 11px;
      color: var(--muted);
      font-family: ui-monospace, Menlo, Consolas, monospace;
    }
    main { max-width: 1120px; margin: 0 auto; padding: 16px 20px 12px; }
    .panel { background: #fff; border: 1px solid var(--line); margin-bottom: 14px; }
    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
      background: #F8FAFC;
    }
    .panel-head h2 {
      margin: 0;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
      color: #3E4E60;
    }
    .panel-head p { margin: 0; font-size: 12px; color: var(--muted); }
    .table-wrap { overflow-x: auto; }
    table.board { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.board th {
      text-align: left;
      font-size: 10px;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
      padding: 6px 8px;
      border-bottom: 1px solid var(--line);
      background: var(--paper);
      white-space: nowrap;
    }
    table.board td {
      padding: 5px 8px;
      border-bottom: 1px solid #E6EDF3;
      white-space: nowrap;
      vertical-align: middle;
    }
    table.board tbody tr:nth-child(even) { background: #F7FAFC; }
    table.board tbody tr[data-icao] { cursor: pointer; }
    table.board tbody tr[data-icao]:hover { background: #E8F3FB; }
    table.board tbody tr.is-selected,
    table.board tbody tr.is-selected:hover {
      background: #D6EAF8;
      box-shadow: inset 3px 0 0 var(--sky);
    }
    table.board td.num, table.board th.num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .mono { font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace; }
    .missing { color: #8A97A3; }
    .empty { color: var(--muted); font-style: italic; }
    .chip {
      display: inline-block;
      padding: 1px 6px 2px;
      border: 1px solid transparent;
      border-radius: 2px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      line-height: 1.45;
    }
    .chip-on_ground { color: #3E4C59; background: #E6EBF0; border-color: #D0D7DF; }
    .chip-airborne { color: #0F4C75; background: #E5F2FB; border-color: #5BA3D9; }
    .chip-pending { color: #6A5424; background: #F4F0E4; border-color: #E0D3B0; }
    .chip-takeoff { color: #1C5C38; background: #E6F4EC; border-color: #B7DCC6; }
    .chip-landing { color: #7A3E1D; background: #F8EFE6; border-color: #E4CDB8; }
    footer {
      max-width: 1120px;
      margin: 0 auto;
      padding: 2px 20px 28px;
      color: var(--muted);
      font-size: 12px;
    }
    footer p { margin: 0 0 4px; }
    footer a { color: var(--sky); }
    .noscript {
      max-width: 1120px;
      margin: 12px auto;
      padding: 0 20px;
      color: var(--muted);
    }
    @media (max-width: 720px) {
      .top-inner { flex-direction: column; align-items: flex-start; }
      .poll { align-items: flex-start; text-align: left; }
      .stats-inner { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .stat { border-bottom: 1px solid #E3EAF1; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div>
        <div class="brand">
          <h1 class="icao" id="icao">——</h1>
          <span class="title" data-i18n="title">机场监视</span>
        </div>
        <p class="place" id="place"></p>
      </div>
      <div class="poll">
        <div class="lang" role="group" data-i18n-aria="langLabel" aria-label="语言">
          <button type="button" id="lang-zh" class="is-active" aria-pressed="true">中文</button>
          <button type="button" id="lang-en" aria-pressed="false">EN</button>
        </div>
        <div class="live"><span class="live-dot" id="live-dot"></span><span id="live-label" data-i18n="idle">待命</span></div>
        <div class="poll-line" id="poll-line" data-i18n="waitingPoll">等待首次轮询</div>
      </div>
    </div>
  </header>
  <div class="accent"></div>
  <div class="banner-wrap" id="banner-wrap" hidden>
    <p class="banner" id="banner"></p>
  </div>
  <section class="stats" data-i18n-aria="counts" aria-label="数量">
    <div class="stats-inner">
      <div class="stat">
        <div class="stat-value" id="count-tracked">0</div>
        <div class="stat-label" data-i18n="tracked">跟踪</div>
        <div class="stat-note" id="note-tracked"></div>
      </div>
      <div class="stat">
        <div class="stat-value" id="count-ground">0</div>
        <div class="stat-label" data-i18n="onGround">地面</div>
        <div class="stat-note"></div>
      </div>
      <div class="stat stat-air">
        <div class="stat-value" id="count-air">0</div>
        <div class="stat-label" data-i18n="airborne">空中</div>
        <div class="stat-note"></div>
      </div>
      <div class="stat">
        <div class="stat-value" id="count-pending">0</div>
        <div class="stat-label" data-i18n="pending">待基线</div>
        <div class="stat-note" data-i18n="notBaselined">未建立基线</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="count-events">0</div>
        <div class="stat-label" data-i18n="eventsToday">今日事件</div>
        <div class="stat-note" id="note-events">自启动以来 0</div>
      </div>
    </div>
  </section>
  <main>
    <section class="panel">
      <div class="panel-head">
        <h2 data-i18n="tracks">航迹</h2>
        <p id="track-note" data-i18n="trackNote">地面状态已去抖。时长为距上次观测的时间。点击一行可保持选中。</p>
      </div>
      <div class="table-wrap">
        <table class="board">
          <thead>
            <tr>
              <th data-i18n="colIcao">ICAO24</th>
              <th data-i18n="colCallsign">呼号</th>
              <th data-i18n="colState">状态</th>
              <th class="num" data-i18n="colAge">时长</th>
              <th class="num" data-i18n="colLat">纬度</th>
              <th class="num" data-i18n="colLon">经度</th>
              <th class="num" data-i18n="colAlt" data-i18n-title="altTitle" title="气压高度，米">高度（米）</th>
              <th class="num" data-i18n="colGs" data-i18n-title="gsTitle" title="地速，米/秒">地速（米/秒）</th>
            </tr>
          </thead>
          <tbody id="track-body">
            <tr><td class="empty" colspan="8" data-i18n="waitingPollSentence">等待首次轮询。</td></tr>
          </tbody>
        </table>
      </div>
    </section>
    <section class="panel">
      <div class="panel-head">
        <h2 data-i18n="recent">近期事件</h2>
        <p data-i18n="recentNote">最新在前。本进程启动以来最近 50 次起飞与降落。</p>
      </div>
      <div class="table-wrap">
        <table class="board">
          <thead>
            <tr>
              <th data-i18n="colTime">时间</th>
              <th data-i18n="colEvent">事件</th>
              <th data-i18n="colIcao">ICAO24</th>
              <th data-i18n="colCallsign">呼号</th>
            </tr>
          </thead>
          <tbody id="event-body">
            <tr><td class="empty" colspan="4" data-i18n="emptyEvents">尚无起飞或降落。</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
  <footer>
    <p id="started"></p>
    <p><span data-i18n="footerBefore">数据来自 </span><a href="https://opensky-network.org/">OpenSky Network</a><span data-i18n="footerAfter">。并非空中交通管制数据。</span></p>
  </footer>
  <noscript><p class="noscript">此看板需要 JavaScript 才能从 /api/status 加载航迹。</p></noscript>
  <script>
    (function () {
      var STRINGS = {
        "zh-CN": {
          title: "机场监视",
          airportFallback: "机场",
          docTitle: "{code} · 机场监视",
          idle: "待命",
          live: "实时",
          stale: "中断",
          waitingPoll: "等待首次轮询",
          waitingPollSentence: "等待首次轮询。",
          tracked: "跟踪",
          onGround: "地面",
          airborne: "空中",
          pending: "待基线",
          eventsToday: "今日事件",
          notBaselined: "未建立基线",
          sinceStart: "自启动以来 {n}",
          inLastPoll: "上次轮询 {n} 架",
          tracks: "航迹",
          trackNote: "地面状态已去抖。时长为距上次观测的时间。点击一行可保持选中。",
          trackNoteRefresh: "地面状态已去抖。本页每 {n} 秒刷新一次。点击一行可保持选中。",
          colIcao: "ICAO24",
          colCallsign: "呼号",
          colState: "状态",
          colAge: "时长",
          colLat: "纬度",
          colLon: "经度",
          colAlt: "高度（米）",
          colGs: "地速（米/秒）",
          altTitle: "气压高度，米",
          gsTitle: "地速，米/秒",
          emptyTracks: "当前没有跟踪的航空器。",
          recent: "近期事件",
          recentNote: "最新在前。本进程启动以来最近 50 次起飞与降落。",
          colTime: "时间",
          colEvent: "事件",
          emptyEvents: "尚无起飞或降落。",
          footerBefore: "数据来自 ",
          footerAfter: "。并非空中交通管制数据。",
          started: "本进程启动于 {time}。",
          pollOpenSky: "OpenSky {clock}",
          ago: "{age} 前",
          credits: "额度 {n}",
          pollFailed: "上次轮询失败：{error}",
          refreshFailed: "看板无法刷新，正在重试。",
          counts: "数量",
          langLabel: "语言",
          state: { on_ground: "地面", airborne: "空中", pending: "待基线" },
          event: { takeoff: "起飞", landing: "降落" }
        },
        en: {
          title: "Airport monitor",
          airportFallback: "Airport",
          docTitle: "{code} · Airport monitor",
          idle: "Idle",
          live: "Live",
          stale: "Stale",
          waitingPoll: "Waiting for the first poll",
          waitingPollSentence: "Waiting for the first poll.",
          tracked: "Tracked",
          onGround: "On ground",
          airborne: "Airborne",
          pending: "Pending",
          eventsToday: "Events today",
          notBaselined: "Not baselined",
          sinceStart: "{n} since start",
          inLastPoll: "{n} in the last poll",
          tracks: "Tracks",
          trackNote: "Debounced ground state. Age is time since the track was seen. Click a row to hold the selection.",
          trackNoteRefresh: "Debounced ground state. This page refetches every {n}s. Click a row to hold the selection.",
          colIcao: "ICAO24",
          colCallsign: "Callsign",
          colState: "State",
          colAge: "Age",
          colLat: "Lat",
          colLon: "Lon",
          colAlt: "Alt m",
          colGs: "GS m/s",
          altTitle: "Barometric altitude, metres",
          gsTitle: "Ground speed, metres per second",
          emptyTracks: "No aircraft tracked.",
          recent: "Recent events",
          recentNote: "Newest first. Last 50 takeoffs and landings since this process started.",
          colTime: "Time",
          colEvent: "Event",
          emptyEvents: "No takeoff or landing yet.",
          footerBefore: "Data from ",
          footerAfter: ". Not an air traffic control feed.",
          started: "This process started {time}.",
          pollOpenSky: "OpenSky {clock}",
          ago: "{age} ago",
          credits: "credits {n}",
          pollFailed: "Last poll failed: {error}",
          refreshFailed: "The board could not refresh. Retrying.",
          counts: "Counts",
          langLabel: "Language",
          state: { on_ground: "On ground", airborne: "Airborne", pending: "Pending" },
          event: { takeoff: "Takeoff", landing: "Landing" }
        }
      };
      var STORAGE_KEY = "airport-monitor-lang";
      var STATE_ORDER = { airborne: 0, pending: 1, on_ground: 2 };
      var selected = null;
      var timer = null;
      var lastData = null;
      var lang = "zh-CN";
      var bannerKey = null;
      var bannerVars = null;

      function $(id) { return document.getElementById(id); }
      function text(id, value) {
        var node = $(id);
        if (node) node.textContent = value;
      }
      function dash() { return "\u2014"; }
      function pad(value) { return String(value).padStart(2, "0"); }
      function localeTag() { return lang === "en" ? "en" : "zh-CN"; }

      function t(key, vars) {
        var pack = STRINGS[lang] || STRINGS["zh-CN"];
        var value = pack[key];
        if (typeof value !== "string") {
          var fallback = STRINGS["zh-CN"][key];
          value = typeof fallback === "string" ? fallback : key;
        }
        if (vars) {
          value = String(value).replace(/\{(\w+)\}/g, function (_match, name) {
            return vars[name] == null ? "" : String(vars[name]);
          });
        }
        return value;
      }

      function label(group, kind) {
        var pack = STRINGS[lang] || STRINGS["zh-CN"];
        var table = pack[group];
        if (table && typeof table[kind] === "string") return table[kind];
        var fallback = STRINGS["zh-CN"][group];
        if (fallback && typeof fallback[kind] === "string") return fallback[kind];
        return kind;
      }

      function normalizeLang(value) {
        if (!value) return null;
        var token = String(value).trim().toLowerCase().replace(/_/g, "-");
        if (token === "en" || token === "en-us" || token === "en-gb") return "en";
        if (token === "zh" || token === "zh-cn" || token === "zh-hans") return "zh-CN";
        return null;
      }

      function initialLang() {
        var params = new URLSearchParams(window.location.search);
        var fromQuery = normalizeLang(params.get("lang"));
        if (fromQuery) {
          try { localStorage.setItem(STORAGE_KEY, fromQuery); } catch (err) { /* private mode */ }
          return fromQuery;
        }
        try {
          var stored = normalizeLang(localStorage.getItem(STORAGE_KEY));
          if (stored) return stored;
        } catch (err) { /* private mode */ }
        return normalizeLang(document.documentElement.getAttribute("data-default-lang")) || "zh-CN";
      }

      function applyStatic() {
        document.documentElement.lang = lang;
        document.querySelectorAll("[data-i18n]").forEach(function (node) {
          node.textContent = t(node.getAttribute("data-i18n"));
        });
        document.querySelectorAll("[data-i18n-title]").forEach(function (node) {
          node.title = t(node.getAttribute("data-i18n-title"));
        });
        document.querySelectorAll("[data-i18n-aria]").forEach(function (node) {
          node.setAttribute("aria-label", t(node.getAttribute("data-i18n-aria")));
        });
        var zhOn = lang !== "en";
        $("lang-zh").classList.toggle("is-active", zhOn);
        $("lang-en").classList.toggle("is-active", !zhOn);
        $("lang-zh").setAttribute("aria-pressed", zhOn ? "true" : "false");
        $("lang-en").setAttribute("aria-pressed", zhOn ? "false" : "true");
      }

      function formatAge(seconds) {
        if (seconds == null || !isFinite(seconds)) return dash();
        var whole = Math.max(0, Math.round(seconds));
        if (whole < 60) return whole + "s";
        var minutes = Math.floor(whole / 60);
        var rem = whole % 60;
        if (minutes < 60) return minutes + "m " + rem + "s";
        var hours = Math.floor(minutes / 60);
        return hours + "h " + (minutes % 60) + "m";
      }

      function formatFixed(value, digits) {
        if (value == null || value === "" || !isFinite(Number(value))) return null;
        return Number(value).toFixed(digits);
      }

      function formatClock(unix) {
        var date = new Date(unix * 1000);
        return pad(date.getHours()) + ":" + pad(date.getMinutes()) + ":" + pad(date.getSeconds());
      }

      function formatEventTime(unix) {
        var date = new Date(unix * 1000);
        var now = new Date();
        var clock = formatClock(unix);
        var same = date.getFullYear() === now.getFullYear()
          && date.getMonth() === now.getMonth()
          && date.getDate() === now.getDate();
        if (same) return clock;
        return pad(date.getMonth() + 1) + "-" + pad(date.getDate()) + " " + clock;
      }

      function cell(value, className) {
        var node = document.createElement("td");
        if (className) node.className = className;
        if (value == null || value === "") {
          node.classList.add("missing");
          node.textContent = dash();
        } else {
          node.textContent = value;
        }
        return node;
      }

      function chip(kind, labelText) {
        var node = document.createElement("span");
        node.className = "chip chip-" + kind;
        node.textContent = labelText;
        return node;
      }

      function setBanner(message) {
        var wrap = $("banner-wrap");
        if (!message) {
          wrap.hidden = true;
          text("banner", "");
          return;
        }
        text("banner", message);
        wrap.hidden = false;
      }

      function showBanner(key, vars) {
        bannerKey = key || null;
        bannerVars = vars || null;
        setBanner(key ? t(key, bannerVars) : "");
      }

      function setLive(key) {
        var dot = $("live-dot");
        dot.classList.remove("is-live", "is-stale");
        if (key === "live") dot.classList.add("is-live");
        if (key === "stale") dot.classList.add("is-stale");
        text("live-label", t(key));
      }

      function renderTracks(tracks) {
        var body = $("track-body");
        body.replaceChildren();
        if (!tracks.length) {
          var empty = document.createElement("tr");
          var td = document.createElement("td");
          td.colSpan = 8;
          td.className = "empty";
          td.textContent = t("emptyTracks");
          empty.appendChild(td);
          body.appendChild(empty);
          return;
        }
        tracks.forEach(function (track) {
          var row = document.createElement("tr");
          row.dataset.icao = track.icao24;
          if (track.icao24 === selected) row.classList.add("is-selected");
          row.appendChild(cell(track.icao24, "mono"));
          row.appendChild(cell(track.callsign, "mono"));
          var stateCell = document.createElement("td");
          var kind = track.state || "pending";
          stateCell.appendChild(chip(kind, label("state", kind)));
          row.appendChild(stateCell);
          row.appendChild(cell(formatAge(track.last_seen_age), "num mono"));
          row.appendChild(cell(formatFixed(track.latitude, 4), "num mono"));
          row.appendChild(cell(formatFixed(track.longitude, 4), "num mono"));
          row.appendChild(cell(formatFixed(track.baro_altitude, 0), "num mono"));
          row.appendChild(cell(formatFixed(track.velocity, 1), "num mono"));
          row.addEventListener("click", function () {
            selected = selected === track.icao24 ? null : track.icao24;
            renderTracks(tracks);
          });
          body.appendChild(row);
        });
      }

      function renderEvents(events) {
        var body = $("event-body");
        body.replaceChildren();
        if (!events.length) {
          var empty = document.createElement("tr");
          var td = document.createElement("td");
          td.colSpan = 4;
          td.className = "empty";
          td.textContent = t("emptyEvents");
          empty.appendChild(td);
          body.appendChild(empty);
          return;
        }
        events.forEach(function (event) {
          var row = document.createElement("tr");
          var time = cell(formatEventTime(event.ts), "mono");
          if (event.ts != null) {
            time.title = new Date(event.ts * 1000).toLocaleString(localeTag()) + " \u00b7 unix " + event.ts;
          }
          row.appendChild(time);
          var kindCell = document.createElement("td");
          var kind = event.event || "";
          kindCell.appendChild(chip(kind, label("event", kind)));
          row.appendChild(kindCell);
          row.appendChild(cell(event.icao24, "mono"));
          row.appendChild(cell(event.callsign, "mono"));
          body.appendChild(row);
        });
      }

      function render(data) {
        lastData = data;
        var counts = data.counts || {};
        text("icao", data.airport || dash());
        text("place", data.name || "");
        document.title = t("docTitle", { code: data.airport || t("airportFallback") });
        text("count-tracked", String(counts.tracked || 0));
        text("count-ground", String(counts.on_ground || 0));
        text("count-air", String(counts.airborne || 0));
        text("count-pending", String(counts.pending || 0));
        text("count-events", String(counts.events_today || 0));
        text("note-events", t("sinceStart", { n: counts.events_since_start || 0 }));
        var trackedNote = "";
        if (data.poll_time != null && data.aircraft_count !== counts.tracked) {
          trackedNote = t("inLastPoll", { n: data.aircraft_count });
        }
        text("note-tracked", trackedNote);

        var poll = t("waitingPoll");
        if (data.poll_time != null) {
          poll = t("pollOpenSky", { clock: formatClock(data.poll_time) });
          if (data.polled_at != null) {
            poll += " \u00b7 " + t("ago", { age: formatAge(Date.now() / 1000 - data.polled_at) });
          }
          if (data.credits_remaining != null) {
            poll += " \u00b7 " + t("credits", { n: data.credits_remaining });
          }
        }
        var pollNode = $("poll-line");
        pollNode.textContent = poll;
        if (data.poll_time != null) {
          pollNode.title = "OpenSky unix " + data.poll_time;
        } else {
          pollNode.removeAttribute("title");
        }

        if (data.last_error) {
          setLive("stale");
          showBanner("pollFailed", { error: data.last_error });
        } else if (data.poll_time == null) {
          setLive("idle");
          showBanner(null);
        } else {
          setLive("live");
          showBanner(null);
        }

        if (data.started_at) {
          var startedAt = new Date(data.started_at * 1000).toLocaleString(localeTag());
          text("started", t("started", { time: startedAt }));
        }
        var seconds = Number(data.refresh_seconds);
        if (isFinite(seconds) && seconds > 0) {
          text("track-note", t("trackNoteRefresh", { n: seconds }));
        }

        var tracks = Array.isArray(data.tracks) ? data.tracks.slice() : [];
        tracks.sort(function (a, b) {
          var order = (STATE_ORDER[a.state] ?? 9) - (STATE_ORDER[b.state] ?? 9);
          if (order) return order;
          var call = String(a.callsign || "").localeCompare(String(b.callsign || ""));
          if (call) return call;
          return String(a.icao24).localeCompare(String(b.icao24));
        });
        renderTracks(tracks);
        renderEvents(Array.isArray(data.events) ? data.events : []);
      }

      function setLang(next, persist) {
        var keepRefreshError = bannerKey === "refreshFailed";
        lang = next === "en" ? "en" : "zh-CN";
        if (persist) {
          try { localStorage.setItem(STORAGE_KEY, lang); } catch (err) { /* private mode */ }
        }
        applyStatic();
        if (lastData) render(lastData);
        else text("note-events", t("sinceStart", { n: $("count-events").textContent || "0" }));
        if (keepRefreshError) {
          setLive("stale");
          showBanner("refreshFailed");
        }
      }

      function schedule(seconds) {
        if (timer) clearTimeout(timer);
        timer = setTimeout(tick, Math.max(1, seconds) * 1000);
      }

      function tick() {
        fetch("/api/status", { cache: "no-store" })
          .then(function (response) {
            if (!response.ok) throw new Error("status " + response.status);
            return response.json();
          })
          .then(function (data) {
            render(data);
            var seconds = Number(data.refresh_seconds);
            schedule(isFinite(seconds) && seconds > 0 ? seconds : 5);
          })
          .catch(function () {
            setLive("stale");
            showBanner("refreshFailed");
            schedule(5);
          });
      }

      $("lang-zh").addEventListener("click", function () { setLang("zh-CN", true); });
      $("lang-en").addEventListener("click", function () { setLang("en", true); });
      setLang(initialLang(), false);

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", tick);
      } else {
        tick();
      }
    })();
  </script>
</body>
</html>
